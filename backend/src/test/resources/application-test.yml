# Overrides the data source of the tests that need a Spring context. Every other setting comes
# from the main configuration, so that the tests run against the production one.
#
# H2 runs in its PostgreSQL compatibility mode so that Flyway applies the real migrations: the
# schema the tests work on is the one the application ships, not one Hibernate improvises.
spring:
  datasource:
    url: jdbc:h2:mem:db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  flyway:
    clean-disabled: false
