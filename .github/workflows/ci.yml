name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push on a branch cancels the run still in progress for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Build
        run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # The API is stubbed at the network level, so the scenarios need neither the back end nor a
      # database: they check the application the way a browser meets it.
      - name: Run the scenarios
        run: npm run e2e

      - name: Publish the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The project is developed on Windows, where git does not track the
      # executable bit: the wrapper is restored as read only on the runner
      # whenever a commit drops the mode recorded in the index.
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # `verify` runs the tests then fails the build when the coverage of the
      # services, the controllers or the exception handling drops below 100%.
      - name: Test and check coverage
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publish the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
