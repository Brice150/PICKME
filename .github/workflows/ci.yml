name: CI

# The application is not deployed: the checks run on pull requests only. A
# push on main, already checked by its pull request, would run them a second
# time for nothing. The back end has its own workflow (backend.yml), so a
# change limited to it does not start the front end checks, and the other way
# round.
on:
  pull_request:
    branches: [main]
    # `ready_for_review` starts the checks once a draft is ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.claude/**'
      - '.github/dependabot.yml'
      - '.github/workflows/backend.yml'
      - 'backend/**'
      - 'docker-compose.yml'
  # Lets the checks be run by hand from the Actions tab.
  workflow_dispatch:

# A new push on a branch cancels the run still in progress for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    # A draft costs no minutes: the checks start when it is ready.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # Safety net: a stuck run stops instead of burning 6 hours of minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # node_modules restored as is: `npm ci` only runs when the lockfile changes.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      # Angular compilation cache (enabled on CI by `cli.cache.environment` in
      # angular.json): the next builds and tests start from the previous one.
      - name: Restore Angular cache
        uses: actions/cache@v6
        with:
          path: .angular/cache
          key: angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            angular-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # The fast checks come first: a formatting or lint error stops the job
      # before the tests, the longest step.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  e2e:
    name: End to end
    # Started only once the unit checks pass: a lint or test failure no longer
    # pays for a browser install and the scenarios on top.
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      # The browser follows the Playwright version of the lockfile: it is only
      # downloaded again when that changes. The system libraries it needs are
      # not cached and are installed on every run.
      - name: Restore the browser
        id: browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the browser system dependencies
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The API is stubbed at the network level, so the scenarios need neither the back end nor a
      # database: they check the application the way a browser meets it.
      - name: Run the scenarios
        run: npm run e2e

      - name: Publish the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
