@if (users && users.length !== 0) {
  <swiper-container
    #carousel
    effect="cards"
    mousewheel="true"
    (swiperslidechange)="onSlideChange()"
  >
    @for (user of users; track user.id; let index = $index) {
      <swiper-slide lazy="true">
        <app-card
          loading="true"
          [user]="user"
          [display]="
            index === activeIndex && !activeMatchAnimation && !isLoading
          "
          [activeMatchAnimation]="activeMatchAnimation"
          (likeEvent)="like(user)"
          (dislikeEvent)="dislike(user)"
        ></app-card>
      </swiper-slide>
    }
    <swiper-slide>
      <app-loading-card
        [loading]="loading"
        [usersNumber]="users.length"
        (goToActionEvent)="goTo($event)"
      ></app-loading-card>
    </swiper-slide>
  </swiper-container>
}
@if (initLoading || (users && users.length === 0)) {
  <div class="loading-container">
    <app-loading-card
      [loading]="initLoading"
      [usersNumber]="users.length"
      (goToActionEvent)="goTo($event)"
    ></app-loading-card>
  </div>
}
